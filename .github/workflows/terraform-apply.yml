name: Terraform Apply

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build API bundle
        run: npm run build --workspace @planup/api

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: terraform -chdir=infra plan -input=false -no-color -out=planup.tfplan

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -auto-approve planup.tfplan

      - name: Generate frontend production environment
        run: terraform -chdir=infra output -raw frontend_env > apps/web/.env.production

      - name: Build frontend
        run: npm run build --workspace @planup/web

      - name: Sync frontend to S3
        run: aws s3 sync apps/web/dist "s3://$(terraform -chdir=infra output -raw web_bucket)" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$(terraform -chdir=infra output -raw cloudfront_distribution_id)" --paths "/*"
